
name: CCAN Weather Station Automation

on:
  schedule:
    - cron: '00,10,22,30,40,50 * * * *'
  workflow_dispatch:
  
permissions:
  contents: read

concurrency:
  group: ccan-weather-update
  cancel-in-progress: false

jobs:
  update-weather:
    name: Download and publish NetCDF
    runs-on: ubuntu-latest

    steps:
      - name: Checkout CCAN weather pipeline
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run CCAN weather update
        env:
          GH_TOKEN: ${{ secrets.CCAN_GITHUB_TOKEN }}
        run: |
          chmod +x run_weather_update.sh
          ./run_weather_update.sh
